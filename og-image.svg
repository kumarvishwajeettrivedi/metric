  <!-- Thin rule -->
  <line x1="600" y1="376" x2="600" y2="418" stroke="#6ee7b7" stroke-width="1"/>

  <!-- Coming Soon -->
  <text
    x="600" y="443"
    font-family="'Inter', 'Helvetica Neue', sans-serif"
    font-size="13"
    font-weight="500"
    fill="#6ee7b7"
    text-anchor="middle"
    letter-spacing="7"

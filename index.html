<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metric — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:         #ffffff;
      --green-900:  #064e3b;
      --green-700:  #047857;
      --green-600:  #059669;
      --green-500:  #10b981;
      --green-400:  #34d399;
      --green-300:  #6ee7b7;
      --green-200:  #a7f3d0;
      --green-100:  #d1fae5;
      --green-50:   #ecfdf5;
      --muted:      #9ca3af;
      --subtle:     #e5e7eb;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
    }

    /* ── Full-viewport grid ── */
    .grid-bg {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      pointer-events: none;
      z-index: 0;
    }

    .cell {
      border-right: 1px solid var(--green-100);
      border-bottom: 1px solid var(--green-100);
      position: relative;
      overflow: hidden;
    }

    /* Outermost borders */
    .cell:nth-child(-n+4)        { border-top: 1px solid var(--green-100); }
    .cell:nth-child(4n+1)        { border-left: 1px solid var(--green-100); }

    /* Tiny coordinate labels */
    .cell::before {
      content: attr(data-coord);
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--green-200);
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
    }

    /* Subtle data hints in corner cells */
    .cell[data-val]::after {
      content: attr(data-val);
      position: absolute;
      bottom: 18px;
      right: 20px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--green-200);
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Faint diagonal accent on corner cells */
    .cell.accent {
      background: linear-gradient(135deg, var(--green-50) 0%, transparent 60%);
    }

    /* ── Main stage ── */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
      padding: 2rem;
    }

    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--green-300);
      margin-bottom: 2.8rem;
      opacity: 0;
      animation: up 0.7s ease forwards 0.2s;
    }

    .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(80px, 17vw, 210px);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.04em;
      color: var(--green-500);
      opacity: 0;
      animation: up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.35s;
    }

    .rule {
      width: 1px;
      height: 52px;
      background: linear-gradient(to bottom, var(--green-300), transparent);
      margin: 2.2rem auto;
      opacity: 0;
      animation: fade 1s ease forwards 1s;
    }

    .coming {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(10px, 1.1vw, 12px);
      font-weight: 500;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--green-300);
      opacity: 0;
      animation: up 0.7s ease forwards 1.1s;
    }

    .tagline {
      margin-top: 2rem;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.03em;
      line-height: 1.9;
      opacity: 0;
      animation: up 0.7s ease forwards 1.25s;
    }

    .tagline strong {
      color: var(--green-600);
      font-weight: 500;
    }

    /* ── Email form ── */
    .form {
      display: flex;
      margin-top: 2.5rem;
      opacity: 0;
      animation: up 0.7s ease forwards 1.4s;
      outline: 1px solid var(--green-100);
      outline-offset: 0;
    }

    .form:focus-within {
      outline-color: var(--green-300);
    }

    .form input {
      border: none;
      outline: none;
      background: transparent;
      padding: 13px 22px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--green-900);
      width: 250px;
    }

    .form input::placeholder {
      color: var(--green-200);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.25em;
    }

    .form button {
      background: var(--green-500);
      border: none;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 13px 24px;
      cursor: pointer;
      transition: background 0.25s;
      white-space: nowrap;
    }

    .form button:hover {
      background: var(--green-700);
    }

    /* ── Footer ── */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.75rem 2.5rem;
      z-index: 10;
      opacity: 0;
      animation: fade 1s ease forwards 1.8s;
    }

    .footer span {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: var(--green-600);
    }

    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--green-200);
    }

    /* ── Keyframes ── */
    @keyframes up {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .grid-bg {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(5, 1fr);
      }
      .footer { padding: 1.25rem 1.5rem; }
      .form input { width: 180px; }
    }
  </style>
</head>
<body>

  <!-- 4×4 grid backdrop -->
  <div class="grid-bg">
    <div class="cell accent" data-coord="A1" data-val="+12.4%"></div>
    <div class="cell" data-coord="A2"></div>
    <div class="cell" data-coord="A3"></div>
    <div class="cell accent" data-coord="A4" data-val="↑ ROI"></div>

    <div class="cell" data-coord="B1"></div>
    <div class="cell" data-coord="B2"></div>
    <div class="cell" data-coord="B3"></div>
    <div class="cell" data-coord="B4"></div>

    <div class="cell" data-coord="C1"></div>
    <div class="cell" data-coord="C2"></div>
    <div class="cell" data-coord="C3"></div>
    <div class="cell" data-coord="C4"></div>

    <div class="cell accent" data-coord="D1" data-val="YTD"></div>
    <div class="cell" data-coord="D2"></div>
    <div class="cell" data-coord="D3"></div>
    <div class="cell accent" data-coord="D4" data-val="∑ Growth"></div>
  </div>

  <!-- Hero -->
  <div class="stage">
    <div class="eyebrow">Finance · Growth · Clarity</div>

    <div class="wordmark">Metric</div>

    <div class="rule"></div>

    <div class="coming">Coming Soon</div>

    <p class="tagline">
      A new way to measure what matters.<br />
      <strong>metricnow.co</strong> — launching shortly.
    </p>

    <form class="form" onsubmit="onSubmit(event)">
      <input type="email" id="em" placeholder="Your email" required />
      <button id="btn" type="submit">Notify Me</button>
    </form>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>© 2025 Metric</span>
    <div class="dot"></div>
    <span><a href="https://instagram.com/metricnow" target="_blank">@metricnow</a></span>
    <div class="dot"></div>
    <span>metricnow.co</span>
  </footer>

  <script>
    function onSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const em  = document.getElementById('em');
      btn.textContent = 'Noted ✓';
      btn.style.background = '#047857';
      em.disabled = true;
      btn.disabled = true;
    }
  </script>
</body>
</html>

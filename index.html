<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metric — Coming Soon</title>

  <!-- Mobile chrome -->
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Open Graph -->
  <meta property="og:title"       content="Metric — Coming Soon" />
  <meta property="og:description" content="A new way to measure what matters. Launching at metricnow.co." />
  <meta property="og:image"       content="https://metricnow.co/og-image.svg" />
  <meta property="og:url"         content="https://metricnow.co" />
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="Metric" />

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Metric — Coming Soon" />
  <meta name="twitter:description" content="A new way to measure what matters. Launching at metricnow.co." />
  <meta name="twitter:image"       content="https://metricnow.co/og-image.svg" />

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png" />
  <link rel="manifest" href="favicon_io/site.webmanifest" />

  <!-- Fonts — preconnect first, then load -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #ffffff;
      --green-900: #064e3b;
      --green-700: #047857;
      --green-600: #059669;
      --green-500: #10b981;
      --green-400: #34d399;
      --green-300: #6ee7b7;
      --green-200: #a7f3d0;
      --green-100: #d1fae5;
      --green-50:  #ecfdf5;
      --muted:     #9ca3af;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* ─────────────────────────────────────────
       LOADER — sits on top, removed once fonts
       are ready so there's zero FOUT
    ───────────────────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    #loader.out {
      opacity: 0;
      visibility: hidden;
    }

    .loader-word {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--green-300);
      animation: loader-pulse 1.4s ease-in-out infinite;
    }

    .loader-bar {
      width: 32px;
      height: 1px;
      background: var(--green-200);
      position: relative;
      overflow: hidden;
      border-radius: 1px;
    }

    .loader-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--green-500);
      transform: translateX(-100%);
      animation: loader-sweep 1.4s ease-in-out infinite;
    }

    @keyframes loader-pulse {
      0%, 100% { opacity: 0.35; }
      50%       { opacity: 1; }
    }

    @keyframes loader-sweep {
      0%   { transform: translateX(-100%); }
      60%  { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    /* ─────────────────────────────────────────
       GRID BACKDROP
    ───────────────────────────────────────── */
    .grid-bg {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      pointer-events: none;
      z-index: 0;
    }

    .cell {
      border-right: 1px solid var(--green-100);
      border-bottom: 1px solid var(--green-100);
      position: relative;
      overflow: hidden;
    }

    .cell:nth-child(-n+4) { border-top:  1px solid var(--green-100); }
    .cell:nth-child(4n+1) { border-left: 1px solid var(--green-100); }

    .cell::before {
      content: attr(data-coord);
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--green-200);
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
    }

    .cell[data-val]::after {
      content: attr(data-val);
      position: absolute;
      bottom: 18px;
      right: 20px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--green-200);
      font-family: 'Space Grotesk', sans-serif;
    }

    .cell.accent {
      background: linear-gradient(135deg, var(--green-50) 0%, transparent 60%);
    }

    /* ─────────────────────────────────────────
       MAIN STAGE
    ───────────────────────────────────────── */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
      padding: 2rem;
    }

    .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(76px, 17vw, 210px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--green-500);
      opacity: 0;
      animation: up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s;
    }

    .rule {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, var(--green-300), transparent);
      margin: 2rem auto;
      opacity: 0;
      animation: fade 1s ease forwards 0.7s;
    }

    .coming {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(17px, 3.5vw, 46px);
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--green-400);
      opacity: 0;
      animation: up 0.7s ease forwards 0.85s;
    }

    /* ─────────────────────────────────────────
       FOOTER
    ───────────────────────────────────────── */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.75rem 2.5rem;
      padding-bottom: max(1.75rem, env(safe-area-inset-bottom));
      z-index: 10;
      opacity: 0;
      animation: fade 1s ease forwards 1.4s;
    }

    .footer span {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: color 0.25s;
      /* bigger tap target on mobile */
      padding: 8px 0;
      margin: -8px 0;
    }

    .footer a:hover { color: var(--green-600); }

    .footer a svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .footer a .link-text {
      position: relative;
    }

    .footer a .link-text::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--green-600);
      transition: width 0.3s ease;
    }

    .footer a:hover .link-text::after { width: 100%; }

    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--green-200);
    }

    /* ─────────────────────────────────────────
       KEYFRAMES
    ───────────────────────────────────────── */
    @keyframes up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ─────────────────────────────────────────
       MOBILE — ≤ 480px
    ───────────────────────────────────────── */
    @media (max-width: 480px) {

      /* 3-column grid, larger cells */
      .grid-bg {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }

      /* fix border selectors for 3-col */
      .cell:nth-child(-n+4) { border-top: none; }
      .cell:nth-child(4n+1) { border-left: none; }
      .cell:nth-child(-n+3) { border-top: 1px solid var(--green-100); }
      .cell:nth-child(3n+1) { border-left: 1px solid var(--green-100); }

      /* hide coord/data labels — cleaner on small screens */
      .cell::before,
      .cell[data-val]::after {
        display: none;
      }

      /* tighter stage padding */
      .stage { padding: 1.25rem; }

      /* wordmark — bold, fills width nicely */
      .wordmark {
        font-size: clamp(72px, 21vw, 120px);
        letter-spacing: -0.035em;
      }

      /* shorter rule */
      .rule {
        height: 36px;
        margin: 1.6rem auto;
      }

      /* coming soon — elegant not oversized */
      .coming {
        font-size: clamp(13px, 4.5vw, 20px);
        letter-spacing: 0.28em;
        font-weight: 500;
      }

      /* footer — center-stacked on mobile */
      .footer {
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 1.25rem 1.5rem;
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      }

      /* hide separator dots when stacked */
      .dot { display: none; }

      /* reorder: Instagram on top, copyright below */
      .footer .insta  { order: 1; }
      .footer .copy   { order: 2; }
      .footer .domain { display: none; }

      /* slightly bigger tap text */
      .footer span { font-size: 10px; }
    }
  </style>
</head>
<body>

  <!-- Loading screen — hides until fonts ready -->
  <div id="loader">
    <div class="loader-word">Metric</div>
    <div class="loader-bar"></div>
  </div>

  <!-- 4×4 grid backdrop -->
  <div class="grid-bg">
    <div class="cell accent" data-coord="A1" data-val="+12.4%"></div>
    <div class="cell" data-coord="A2"></div>
    <div class="cell" data-coord="A3"></div>
    <div class="cell accent" data-coord="A4" data-val="↑ ROI"></div>

    <div class="cell" data-coord="B1"></div>
    <div class="cell" data-coord="B2"></div>
    <div class="cell" data-coord="B3"></div>
    <div class="cell" data-coord="B4"></div>

    <div class="cell" data-coord="C1"></div>
    <div class="cell" data-coord="C2"></div>
    <div class="cell" data-coord="C3"></div>
    <div class="cell" data-coord="C4"></div>

    <div class="cell accent" data-coord="D1" data-val="YTD"></div>
    <div class="cell" data-coord="D2"></div>
    <div class="cell" data-coord="D3"></div>
    <div class="cell accent" data-coord="D4"></div>
  </div>

  <!-- Hero -->
  <div class="stage">
    <div class="wordmark">Metric</div>
    <div class="rule"></div>
    <div class="coming">Coming Soon</div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span class="copy">© 2025 Metric</span>
    <div class="dot"></div>
    <span class="insta">
      <a href="https://www.instagram.com/metricnow/?hl=en" target="_blank" rel="noopener">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
        </svg>
        <span class="link-text">@metricnow</span>
      </a>
    </span>
    <div class="dot"></div>
    <span class="domain">metricnow.co</span>
  </footer>

  <script>
    // Dismiss loader once all fonts are parsed and rendered
    document.fonts.ready.then(function () {
      var loader = document.getElementById('loader');
      loader.classList.add('out');
      setTimeout(function () { loader.remove(); }, 600);
    });

    // Fallback: remove loader after 2.5s even if fonts fail
    setTimeout(function () {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('out');
        setTimeout(function () { loader.remove(); }, 600);
      }
    }, 2500);
  </script>
</body>
</html>

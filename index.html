<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METRIC — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #050505;
      --white: #f8f6f1;
      --cream: #ede9e0;
      --accent: #c8b89a;
      --dim: #6b6560;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 100;
    }

    /* Glow orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }

    .orb-1 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(200, 184, 154, 0.12) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      animation: drift1 18s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(200, 184, 154, 0.08) 0%, transparent 70%);
      bottom: -80px;
      right: -80px;
      animation: drift2 22s ease-in-out infinite alternate;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes drift1 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(80px, 60px) scale(1.15); }
    }
    @keyframes drift2 {
      from { transform: translate(0, 0) scale(1.1); }
      to   { transform: translate(-60px, -50px) scale(0.9); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 0.8; transform: translate(-50%, -50%) scale(1.3); }
    }

    /* Fine grid lines */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200, 184, 154, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200, 184, 154, 0.04) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 0;
    }

    /* Main content */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
      max-width: 1100px;
    }

    /* METRIC wordmark */
    .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(10px, 1.2vw, 13px);
      font-weight: 600;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s;
      position: relative;
    }

    .wordmark::before,
    .wordmark::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40px;
      height: 1px;
      background: var(--accent);
      opacity: 0.5;
    }
    .wordmark::before { right: calc(100% + 16px); }
    .wordmark::after  { left:  calc(100% + 16px); }

    /* COMING SOON hero */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1em;
      margin-bottom: 3.5rem;
    }

    .hero-line {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(72px, 14vw, 180px);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.03em;
      color: var(--white);
      opacity: 0;
      transform: translateY(40px);
    }

    .hero-line:nth-child(1) { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.4s; }
    .hero-line:nth-child(2) {
      animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.55s;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(200, 184, 154, 0.6);
    }

    /* Thin divider */
    .divider {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, var(--accent), transparent);
      margin: 0.5rem 0 3rem;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.1s;
    }

    /* Sub copy */
    .sub {
      font-size: clamp(13px, 1.4vw, 15px);
      font-weight: 400;
      color: var(--dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      max-width: 420px;
      line-height: 1.9;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.2s;
    }

    .sub strong {
      color: var(--accent);
      font-weight: 500;
    }

    /* Footer row */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 3rem;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.6s;
    }

    .footer-item {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--dim);
      font-weight: 500;
      transition: color 0.3s;
    }

    .footer-item a {
      color: inherit;
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-item a:hover,
    .footer-item:hover {
      color: var(--accent);
    }

    .footer-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.5;
    }

    /* Email input */
    .notify-form {
      display: flex;
      align-items: center;
      gap: 0;
      margin-top: 3rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.4s;
    }

    .notify-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(200, 184, 154, 0.2);
      border-right: none;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 14px 22px;
      outline: none;
      width: 260px;
      transition: border-color 0.3s, background 0.3s;
    }

    .notify-input::placeholder {
      color: var(--dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .notify-input:focus {
      background: rgba(200, 184, 154, 0.06);
      border-color: rgba(200, 184, 154, 0.5);
    }

    .notify-btn {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--black);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 14px 24px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
      white-space: nowrap;
    }

    .notify-btn:hover {
      background: var(--cream);
      border-color: var(--cream);
    }

    /* Corner accents */
    .corner {
      position: fixed;
      width: 30px;
      height: 30px;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.8s;
    }
    .corner-tl { top: 28px; left: 28px; border-top: 1px solid rgba(200,184,154,0.4); border-left: 1px solid rgba(200,184,154,0.4); }
    .corner-tr { top: 28px; right: 28px; border-top: 1px solid rgba(200,184,154,0.4); border-right: 1px solid rgba(200,184,154,0.4); }
    .corner-bl { bottom: 28px; left: 28px; border-bottom: 1px solid rgba(200,184,154,0.4); border-left: 1px solid rgba(200,184,154,0.4); }
    .corner-br { bottom: 28px; right: 28px; border-bottom: 1px solid rgba(200,184,154,0.4); border-right: 1px solid rgba(200,184,154,0.4); }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Cursor glow follower */
    .cursor-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,184,154,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%);
      transition: left 0.15s ease, top 0.15s ease;
      filter: blur(40px);
    }

    @media (max-width: 600px) {
      .footer { padding: 1.5rem; }
      .wordmark::before, .wordmark::after { width: 20px; }
      .notify-input { width: 200px; }
      .corner { display: none; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid"></div>
  <div class="cursor-glow" id="glow"></div>

  <!-- Corner accents -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="container">
    <div class="wordmark">Metric</div>

    <div class="hero">
      <div class="hero-line">Coming</div>
      <div class="hero-line">Soon</div>
    </div>

    <div class="divider"></div>

    <p class="sub">
      Something new is being built.<br />
      <strong>metricnow.co</strong> — launching shortly.
    </p>

    <form class="notify-form" onsubmit="handleSubmit(event)">
      <input class="notify-input" type="email" placeholder="Your email" id="emailInput" required />
      <button class="notify-btn" type="submit" id="notifyBtn">Notify Me</button>
    </form>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-item">© 2025 Metric</div>
    <div class="footer-dot"></div>
    <div class="footer-item">
      <a href="https://instagram.com/metricnow" target="_blank">@metricnow</a>
    </div>
    <div class="footer-dot"></div>
    <div class="footer-item">metricnow.co</div>
  </footer>

  <script>
    // Cursor glow follow
    const glow = document.getElementById('glow');
    document.addEventListener('mousemove', e => {
      glow.style.left = e.clientX + 'px';
      glow.style.top  = e.clientY + 'px';
    });

    // Notify form
    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('notifyBtn');
      const input = document.getElementById('emailInput');
      btn.textContent = 'You\'re in ✦';
      btn.style.background = '#1a1a1a';
      btn.style.color = '#c8b89a';
      btn.style.borderColor = '#c8b89a';
      btn.style.letterSpacing = '0.15em';
      input.disabled = true;
      input.style.opacity = '0.4';
      btn.disabled = true;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metric — Coming Soon</title>
  <link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png" />
  <link rel="manifest" href="favicon_io/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:         #ffffff;
      --green-900:  #064e3b;
      --green-700:  #047857;
      --green-600:  #059669;
      --green-500:  #10b981;
      --green-400:  #34d399;
      --green-300:  #6ee7b7;
      --green-200:  #a7f3d0;
      --green-100:  #d1fae5;
      --green-50:   #ecfdf5;
      --muted:      #9ca3af;
      --subtle:     #e5e7eb;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
    }

    /* ── Full-viewport grid ── */
    .grid-bg {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      pointer-events: none;
      z-index: 0;
    }

    .cell {
      border-right: 1px solid var(--green-100);
      border-bottom: 1px solid var(--green-100);
      position: relative;
      overflow: hidden;
    }

    /* Outermost borders */
    .cell:nth-child(-n+4)        { border-top: 1px solid var(--green-100); }
    .cell:nth-child(4n+1)        { border-left: 1px solid var(--green-100); }

    /* Tiny coordinate labels */
    .cell::before {
      content: attr(data-coord);
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--green-200);
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
    }

    /* Subtle data hints in corner cells */
    .cell[data-val]::after {
      content: attr(data-val);
      position: absolute;
      bottom: 18px;
      right: 20px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--green-200);
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Faint diagonal accent on corner cells */
    .cell.accent {
      background: linear-gradient(135deg, var(--green-50) 0%, transparent 60%);
    }

    /* ── Main stage ── */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
      padding: 2rem;
    }

    .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(80px, 17vw, 210px);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.04em;
      color: var(--green-500);
      opacity: 0;
      animation: up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.35s;
    }

    .rule {
      width: 1px;
      height: 52px;
      background: linear-gradient(to bottom, var(--green-300), transparent);
      margin: 2.2rem auto;
      opacity: 0;
      animation: fade 1s ease forwards 1s;
    }

    .coming {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(22px, 3.5vw, 48px);
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--green-400);
      opacity: 0;
      animation: up 0.7s ease forwards 1.1s;
    }

    /* ── Footer ── */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.75rem 2.5rem;
      z-index: 10;
      opacity: 0;
      animation: fade 1s ease forwards 1.8s;
    }

    .footer span {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: var(--green-600);
    }

    .footer a svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--green-200);
    }

    /* ── Keyframes ── */
    @keyframes up {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .grid-bg {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(5, 1fr);
      }
      .footer { padding: 1.25rem 1.5rem; }
      .form input { width: 180px; }
    }
  </style>
</head>
<body>

  <!-- 4×4 grid backdrop -->
  <div class="grid-bg">
    <div class="cell accent" data-coord="A1" data-val="+12.4%"></div>
    <div class="cell" data-coord="A2"></div>
    <div class="cell" data-coord="A3"></div>
    <div class="cell accent" data-coord="A4" data-val="↑ ROI"></div>

    <div class="cell" data-coord="B1"></div>
    <div class="cell" data-coord="B2"></div>
    <div class="cell" data-coord="B3"></div>
    <div class="cell" data-coord="B4"></div>

    <div class="cell" data-coord="C1"></div>
    <div class="cell" data-coord="C2"></div>
    <div class="cell" data-coord="C3"></div>
    <div class="cell" data-coord="C4"></div>

    <div class="cell accent" data-coord="D1" data-val="YTD"></div>
    <div class="cell" data-coord="D2"></div>
    <div class="cell" data-coord="D3"></div>
    <div class="cell accent" data-coord="D4"></div>
  </div>

  <!-- Hero -->
  <div class="stage">
    <div class="wordmark">Metric</div>

    <div class="rule"></div>

    <div class="coming">Coming Soon</div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>© 2025 Metric</span>
    <div class="dot"></div>
    <span>
      <a href="https://www.instagram.com/metricnow/?hl=en" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
        </svg>
        @metricnow
      </a>
    </span>
    <div class="dot"></div>
    <span>metricnow.co</span>
  </footer>
</body>
</html>
